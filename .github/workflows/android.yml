# Build the Android APK (Pikmin 1 and Pikmin 2, USA and PAL, plus the installer
# and launcher libraries) so a change that breaks the Android build shows up as
# a red check. Nothing here needs a game disc, and the release variant is
# signed with the debug key because the runner has no keystore.properties.
name: Android

# Skip when a change cannot affect the APK. Gradle lives in
# games/pikmin1/android and its CMake build compiles games/pikmin1,
# games/pikmin2 and libs/ (and reads versions.json). The workflow file is
# listed so an edit here still runs.
on:
  pull_request:
    paths:
      - '.github/workflows/android.yml'
      - 'games/pikmin1/**'
      - 'games/pikmin2/**'
      - 'libs/**'
      - 'versions.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/android.yml'
      - 'games/pikmin1/**'
      - 'games/pikmin2/**'
      - 'libs/**'
      - 'versions.json'
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR or branch cancels the run it replaces.
concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with ndkVersion and the cmake version in
  # games/pikmin1/android/app/build.gradle; the "Check pinned versions" step
  # fails when they drift.
  NDK_VERSION: 28.2.13676358
  CMAKE_VERSION: 3.22.1
  ANDROID_DIR: games/pikmin1/android
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 1G
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_NOHASHDIR: "true"
  # The pinned NDK version identifies the compiler. The default check hashes
  # the compiler's mtime, which changes whenever the NDK is installed again.
  CCACHE_COMPILERCHECK: string:28.2.13676358

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - name: Check pinned versions match build.gradle
        run: |
          grep -q "ndkVersion '$NDK_VERSION'" "$ANDROID_DIR/app/build.gradle"
          grep -q "version '$CMAKE_VERSION'" "$ANDROID_DIR/app/build.gradle"
          test "$CCACHE_COMPILERCHECK" = "string:$NDK_VERSION"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # setup-gradle validates every gradle-wrapper.jar in the repo, including
      # the vendored SDL2 sample projects under third_party, whose jar is not a
      # Gradle release. Our wrappers still go through the check; only that one
      # checksum is allowed, and the build never runs those wrappers.
      - uses: gradle/actions/wrapper-validation@v6
        with:
          allow-checksums: 2c23278a62dc9f96ab11bee897d9f53e6479d6419135e4560ce822a6431df5e5

      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false

      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache

      # sdkmanager spends most of this step downloading the pinned NDK and
      # CMake. Cache those two packages, keyed on the versions above, and
      # install only when the key misses. A version bump changes the key and
      # the path, so an old package is never restored in place of a new one.
      - name: Locate the Android SDK
        id: android-sdk
        run: |
          test -n "${ANDROID_HOME}"
          test -d "${ANDROID_HOME}"
          echo "home=${ANDROID_HOME%/}" >> "$GITHUB_OUTPUT"

      - name: Restore NDK and CMake
        id: ndk-cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.android-sdk.outputs.home }}/ndk/${{ env.NDK_VERSION }}
            ${{ steps.android-sdk.outputs.home }}/cmake/${{ env.CMAKE_VERSION }}
          key: android-ndk-${{ env.NDK_VERSION }}-cmake-${{ env.CMAKE_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install NDK and CMake
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION"

      - name: Check NDK and CMake
        run: |
          test -d "$ANDROID_HOME/ndk/$NDK_VERSION"
          test -x "$ANDROID_HOME/cmake/$CMAKE_VERSION/bin/cmake"
          "$ANDROID_HOME/cmake/$CMAKE_VERSION/bin/cmake" --version

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-android-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ccache-android-${{ runner.arch }}-

      - name: Build the APK
        id: build
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          # Stats for this job start at zero. A retry must not wipe hits from
          # the first attempt.
          ccache --zero-stats
          log="${RUNNER_TEMP}/gradle-assemble.log"
          # The native build prints hundreds of thousands of C++ lines.
          # Streaming them into the Actions log has killed this step before
          # Gradle could print a result. Keep the transcript in a file.
          run_assemble() {
            ./gradlew assembleRelease -PnectarCompilerLauncher=ccache >"$log" 2>&1
          }
          show_tail() {
            echo "::group::Last 200 lines of assembleRelease (exit $1)"
            tail -n 200 "$log" || true
            echo "::endgroup::"
          }
          # One retry for a Java heap OOM, SIGKILL (137), or a death that
          # never printed Gradle's failure summary. A normal BUILD FAILED
          # without an OOM is a real compile error and stops here.
          should_retry() {
            if grep -aEq 'OutOfMemoryError|Java heap space' "$log"; then
              return 0
            fi
            if [ "$1" -eq 137 ]; then
              return 0
            fi
            if grep -aEq 'BUILD FAILED|FAILURE:' "$log"; then
              return 1
            fi
            return 0
          }
          if run_assemble; then
            echo "assembleRelease succeeded"
            exit 0
          else
            status=$?
          fi
          show_tail "$status"
          if ! should_retry "$status"; then
            echo "::error::assembleRelease failed with a Gradle error and no Java heap OOM; not retrying."
            exit "$status"
          fi
          echo "::warning::assembleRelease failed (exit ${status}) in a way that looks like a heap OOM or an abrupt kill; retrying once."
          ./gradlew --stop || true
          if run_assemble; then
            echo "assembleRelease succeeded on retry"
            exit 0
          else
            status=$?
          fi
          show_tail "$status"
          echo "::error::assembleRelease failed again (exit ${status})."
          exit "$status"

      - name: ccache stats
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        run: ccache --show-stats

      # A missing library still produces an APK, and the app would only fail
      # at install or launch time.
      - name: Check the APK has every native library
        run: |
          apk=$(ls "$ANDROID_DIR"/app/build/outputs/apk/release/*.apk)
          ls -l "$apk"
          entries=$(unzip -Z1 "$apk")
          missing=0
          for lib in SDL2 nectar nectar-pal nectar2 nectar2-pal nectar_installer nectar_launcher; do
            if ! grep -Fxq "lib/arm64-v8a/lib$lib.so" <<< "$entries"; then
              echo "::error::lib$lib.so is missing from $apk"
              missing=1
            fi
          done
          exit $missing

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: open-nectar-apk
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
