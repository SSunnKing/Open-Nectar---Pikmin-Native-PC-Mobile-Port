# Build Pikmin 1 and Pikmin 2 on Linux with the GLES renderer and the touch
# control layer on, as Android builds them, then run both ctest suites. The two
# games are separate jobs so they run at the same time. Desktop builds leave
# that code out, so this catches most Android-only breakage without a phone or
# emulator. Nothing here needs a game disc.
name: GLES and touch (Linux)

# Skip when a change cannot affect this Linux GLES/touch build. It configures
# games/pikmin1 and games/pikmin2 with -DPIKMIN_GLES=ON -DPIKMIN_TOUCH=ON,
# which also compiles libs/, tools/ (mapmaker and modelmaker default on for
# desktop), tests/ (the touch suite) and reads versions.json. The workflow
# file is listed so an edit here still runs.
on:
  pull_request:
    paths:
      - '.github/workflows/gles-touch.yml'
      - 'games/pikmin1/**'
      - 'games/pikmin2/**'
      - 'libs/**'
      - 'tools/**'
      - 'tests/**'
      - 'versions.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/gles-touch.yml'
      - 'games/pikmin1/**'
      - 'games/pikmin2/**'
      - 'libs/**'
      - 'tools/**'
      - 'tests/**'
      - 'versions.json'
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR or branch cancels the run it replaces.
concurrency:
  group: gles-touch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 500M
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_NOHASHDIR: "true"
  # pc_jaudio_integration_test runs the game with --audio-self-test and needs
  # the disc's sound banks (LABELS "game-assets"). CI never has a disc.
  CTEST_EXCLUDE_LABELS: game-assets
  # The Android configuration's renderer and input switches.
  GLES_TOUCH_FLAGS: -DPIKMIN_GLES=ON -DPIKMIN_TOUCH=ON

jobs:
  build-and-test:
    name: ${{ matrix.game == 'p1' && 'Pikmin 1' || 'Pikmin 2' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        game: [p1, p2]
        include:
          - game: p1
            source: games/pikmin1
            build_dir: build/pikmin1
            cmake_options: "-DPIKMIN_BUILD_TESTS=ON -DPIKMIN_NATIVE_JAUDIO=ON"
          - game: p2
            source: games/pikmin2
            build_dir: build/pikmin2
            cmake_options: "-DBUILD_TESTING=ON"

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build ccache pkg-config libsdl2-dev \
            libgl1-mesa-dev libgles-dev libegl-dev libx11-dev

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          # Separate keys so the two games, which now run together, do not
          # overwrite each other's cache. The last prefix still matches the
          # combined cache from before the split.
          key: ccache-gles-touch-${{ matrix.game }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-gles-touch-${{ matrix.game }}-${{ runner.arch }}-
            ccache-gles-touch-${{ runner.arch }}-

      - name: Configure
        run: |
          ccache --zero-stats
          cmake -S "${{ matrix.source }}" -B "${{ matrix.build_dir }}" -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            ${{ matrix.cmake_options }} \
            $GLES_TOUCH_FLAGS

      # -k 0: report every compile error in one run, not only the first.
      - name: Build
        run: cmake --build "${{ matrix.build_dir }}" --parallel -- -k 0

      - name: Test
        run: ctest --test-dir "${{ matrix.build_dir }}" --output-on-failure --timeout 300 -LE "$CTEST_EXCLUDE_LABELS"

      - name: ccache stats
        if: ${{ !cancelled() }}
        run: ccache --show-stats

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gles-touch-test-logs-${{ matrix.game }}
          path: |
            ${{ matrix.build_dir }}/Testing/Temporary/LastTest*.log
            ${{ matrix.build_dir }}/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
